[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "context-stats"
version = "1.25.0"
description = "Monitor your Claude Code session context in real-time - track token usage and never run out of context"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Nguyen Luong", email = "luongnv89@gmail.com" }
]
keywords = [
    "claude",
    "claude-code",
    "context",
    "tokens",
    "monitoring",
    "statusline",
    "terminal",
    "cli",
    "dashboard",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = []

[project.scripts]
claude-statusline = "claude_statusline.cli.statusline:main"
context-stats = "claude_statusline.cli.context_stats:main"

[project.urls]
Homepage = "https://github.com/luongnv89/context-stats"
Documentation = "https://github.com/luongnv89/context-stats#readme"
Repository = "https://github.com/luongnv89/context-stats"
Issues = "https://github.com/luongnv89/context-stats/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "build>=1.0.0",
    "twine>=7.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/claude_statusline"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/examples",
    "/README.md",
    "/LICENSE",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = ["E501"]  # line too long (handled by formatter)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
strict_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests/python"]
# Coverage floor (Task 5.7, issue #148): raised from 84 (issue #141, which in
# turn superseded the interim 73% floor of issue #117 / F-TEST-006) to the
# bound M3 target of 94%. Measured over src/claude_statusline — coverage
# compares fail-under against the unrounded value, so the literal keeps real
# headroom below the measured total. Inert unless coverage is requested
# (--cov); every invocation that does request it inherits the enforcement.
addopts = "-v --tb=short --cov-fail-under=94"
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["src/claude_statusline"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
