[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "context-stats"
version = "1.24.0"
description = "Monitor your Claude Code session context in real-time - track token usage and never run out of context"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Nguyen Luong", email = "luongnv89@gmail.com" }
]
keywords = [
    "claude",
    "claude-code",
    "context",
    "tokens",
    "monitoring",
    "statusline",
    "terminal",
    "cli",
    "dashboard",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = []

[project.scripts]
claude-statusline = "claude_statusline.cli.statusline:main"
context-stats = "claude_statusline.cli.context_stats:main"

[project.urls]
Homepage = "https://github.com/luongnv89/cc-context-stats"
Documentation = "https://github.com/luongnv89/cc-context-stats#readme"
Repository = "https://github.com/luongnv89/cc-context-stats"
Issues = "https://github.com/luongnv89/cc-context-stats/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/claude_statusline"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/examples",
    "/README.md",
    "/LICENSE",
]

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = ["E501"]  # line too long (handled by formatter)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_ignores = true
strict_optional = true
ignore_missing_imports = true

# Known-findings baseline (issue #116; burn-down scheduled in Task 5.7 of the
# modernization plan). The known mypy errors are suppressed by inline
# `# type: ignore[<code>]` comments at each site — never a blanket disable.
# Because warn_unused_ignores=true above, any ignore that outlives its error
# fails typecheck itself, so this list shrinks automatically as findings are
# fixed. Per-module counts of committed ignore comments:
#   cli/cache_warm.py       no-any-return=1  attr-defined=8
#   core/config.py          assignment=2
#   cli/context_stats.py    assignment=1
#   graphs/intelligence.py  no-any-return=1
#   graphs/renderer.py      attr-defined=3
#   cli/export.py           attr-defined=4
#
# Three cache_warm.py attr-defined ignores also list `unused-ignore`: inside
# multi-line implicitly-concatenated f-strings, mypy attributes the error to a
# different physical line depending on the interpreter it runs under (PEP 701
# tokenization on 3.12+ vs legacy on 3.11), so the error may legitimately be
# absent on one side. Listing `unused-ignore` keeps those sites valid under
# both; Task 5.7 should remove the whole comment when it fixes each site.

[tool.pytest.ini_options]
testpaths = ["tests/python"]
# Coverage floor (issue #117, F-TEST-006): measured over src/claude_statusline
# on main — 2750 statements, 721 missed, identical across the Python 3.9-3.12
# CI matrix legs and stable between interpreters locally. The precise total is
# 73.78%, and coverage compares fail-under against the unrounded value, so a
# literal 74 would fail on main itself; 73 is today's measured-value floor.
# Raised toward the 94% M3 target by Tasks 4.6 and 5.7 of the modernization
# plan. Inert unless coverage is requested (--cov); every invocation that does
# request it inherits the enforcement.
addopts = "-v --tb=short --cov-fail-under=73"
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["src/claude_statusline"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
