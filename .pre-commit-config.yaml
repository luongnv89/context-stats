# Pre-commit hooks for claude-statusline project
# Install: pip install pre-commit && pre-commit install
# Run all: pre-commit run --all-files

default_language_version:
  python: python3

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-toml
      # Generated golden fixtures are byte-compared against tool output in
      # tests; they must never be rewritten by whitespace hooks.
      - id: end-of-file-fixer
        exclude: ^tests/python/fixtures/
      - id: trailing-whitespace
        exclude: ^tests/python/fixtures/
      - id: mixed-line-ending
        args: ['--fix=lf']
        exclude: ^tests/python/fixtures/
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=500']

  # ShellCheck for bash scripts
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck
        args: ['--severity=warning']
        files: \.(sh|bash)$

  # Python: Ruff linter and formatter
  # Rev must track requirements-dev.constraints.txt ruff==... — CI lint and
  # this hook must never disagree about formatting (issue #118).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff
        args: ['--fix']
        files: \.py$
      - id: ruff-format
        files: \.py$

  # Markdown lint
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        args: ['--fix', '--disable', 'MD013', 'MD024', 'MD033', 'MD040', 'MD041', '--']
        # Golden fixtures are generated output pinned byte-exactly by tests;
        # table-style rules (MD060) do not apply to them.
        exclude: ^tests/python/fixtures/

  # E2E clean install smoke tests (local script)
  - repo: local
    hooks:
      - id: e2e-install-tests
        name: E2E clean install smoke tests
        language: script
        entry: scripts/e2e-install-test.sh
        pass_filenames: false
        always_run: true

ci:
  autofix_prs: true
  autofix_commit_msg: 'style: auto-fix pre-commit issues'
  autoupdate_schedule: monthly
